{% extends "shell.html" %}
{% block title %}Topology — Watchtower{% endblock %}
{% block content %}
<section class="panel" data-testid="topology-panel">
  <header class="panel-head">
    <h1>Network Topology</h1>
    <button type="button" class="btn-ghost" id="topology-refresh" data-testid="topology-refresh">Refresh</button>
  </header>
  <div id="topology-canvas" class="topology-canvas" data-testid="topology-canvas"></div>
  <p id="topology-legend" class="panel-sub" data-testid="topology-legend"></p>
</section>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" defer></script>
<script src="{{ url_for('static', filename='topology.js') }}" defer></script>
<script>window.addEventListener('load', () => window.Watchtower.topology && window.Watchtower.topology.mount());</script>
{% endblock %}
