{% extends "shell.html" %}
{% block title %}Observatory — Watchtower{% endblock %}
{% block content %}
<section class="panel" data-testid="observatory-panel">
  <header class="panel-head">
    <h1>Observatory</h1>
    <p class="panel-sub">Live analytics across the pipeline</p>
  </header>
  <div class="kpi-grid" data-testid="observatory-kpis">
    <article class="kpi"><span class="kpi-label">Logs / sec</span><span class="kpi-value" id="kpi-lps" data-testid="kpi-lps">—</span></article>
    <article class="kpi"><span class="kpi-label">Queue depth</span><span class="kpi-value" id="kpi-queue" data-testid="kpi-queue">—</span></article>
    <article class="kpi"><span class="kpi-label">Parse failures</span><span class="kpi-value" id="kpi-parse-fail" data-testid="kpi-parse-fail">—</span></article>
    <article class="kpi"><span class="kpi-label">Devices online</span><span class="kpi-value" id="kpi-devices" data-testid="kpi-devices">—</span></article>
  </div>
  <div class="chart-grid">
    <figure class="chart-card">
      <figcaption>Throughput (last 5m)</figcaption>
      <canvas id="chart-throughput" data-testid="chart-throughput" height="180"></canvas>
    </figure>
    <figure class="chart-card">
      <figcaption>Severity mix</figcaption>
      <canvas id="chart-severity" data-testid="chart-severity" height="180"></canvas>
    </figure>
    <figure class="chart-card">
      <figcaption>Top sources</figcaption>
      <canvas id="chart-sources" data-testid="chart-sources" height="180"></canvas>
    </figure>
    <figure class="chart-card">
      <figcaption>Incident timeline</figcaption>
      <canvas id="chart-incidents" data-testid="chart-incidents" height="180"></canvas>
    </figure>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<script>window.addEventListener('load', () => window.Watchtower.observatory && window.Watchtower.observatory.mount());</script>
{% endblock %}
