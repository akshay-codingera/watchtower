[server]
name        = WATCHTOWER
environment = development
debug       = false
log_level   = INFO

[intake]
udp_host    = 0.0.0.0
udp_port    = 5140
tcp_port    = 5141
tls_port    = 6514
tls_enabled = false
tls_cert    =
tls_key     =
queue_size  = 10000
rate_limit  = 1000
recv_buffer = 4194304

[ledger]
db_path                  = logs/syslog.db
fts_enabled              = true
wal_mode                 = true
retention_auth_days      = 90
retention_network_days   = 60
retention_firewall_days  = 90
retention_system_days    = 30
retention_app_days       = 30

[auth]
admin_password_hash = 2c4f6c59e62049989c7ee72538c82f80551b927f172c560c17a4728d3e15e581
secret_key          = bc6c260b7110cb6bf3c9639802ec40d3362480efcc5ef7876a58035c66c3f473
session_lifetime    = 28800
max_failed_logins   = 5
lockout_duration    = 300

[portal]
host = 0.0.0.0
port = 5000
https = false
max_content_length = 4194304
session_cookie_name = watchtower_session
content_security_policy =

[relay]
enabled             = false
role                = standalone
peer_ip             =
virtual_ip          =
heartbeat_interval  = 1
sync_interval        = 5

[scheduler]
enabled             = true
backup_hour         = 2
